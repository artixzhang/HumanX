# @package _global_

# Enable explicitly with +opt=skill_sampling (place after +exp=...).
# Skill IDs are one-hot column indices from the converted data, not filenames.
# Relative weights: 7:2:1 and 0.7:0.2:0.1 are equivalent. Unlisted skills get 0.
# Example below assumes 0=shoot, 1=hold, 2=stand; change to match your dataset.
# A positive weight for a skill absent from the data is an error.
# Only training reference-motion allocation changes; sequential evaluation and
# within-motion RSI keep their existing behavior. No motion reload is enabled.
env:
  config:
    skill_sampling:
      enabled: true
      weights:
        "0": 0.15 # hold
        "1": 0.55 # shoot
        "2": 0.15 # stand
        "3": 0.15 # stand to hold
      # Optional per-skill override for noise_to_initial_level (scales robot dof/root init noise).
      # Unlisted skills fall back to noise_to_initial_level.
      init_noise_level:
        "0": 1.0 # hold
        "1": 0.5 # shoot (reduced robot pose randomization while preserving stance variation)
        "2": 1.0 # stand
        "3": 1.0 # stand to hold
      # Optional per-skill override for init_noise_scale.obj_pos (multiplied by skill init_noise_level).
      # Unlisted skills fall back to init_noise_scale.obj_pos.
      init_obj_pos_noise:
        "0": 0.10 # hold
        "1": 0.0 # shoot
        "2": 0.0 # stand
        "3": 0.0 # stand to hold
      # Optional per-skill override for domain_rand.object_push.initial_delay_s (seconds).
      # Unlisted skills fall back to domain_rand.object_push.initial_delay_s.
      init_obj_push_delay_s:
        "0": 0.5 # hold
        "1": 0.5 # shoot
      # Optional per-skill reward scale and tracking sigma overrides (keyed by skill ID).
      # A tracking sigma can be a single float or a multi-scale list (e.g. [0.02, 0.10] for dual-kernel).
      # Unlisted skills or reward names fall back to the global reward_scales and reward_tracking_sigma.
      reward_overrides:
        "0": # hold (ball position uses dual-kernel for recovery + precision; velocity tracking disabled)
          reward_scales:
            ball_position: 4.0
            ball_velocity: 0.0
          reward_tracking_sigma:
            ball_position: [0.02, 0.10]
        "1": # shoot (dual-kernel [fine, coarse] provides wide capture funnel + sharp release precision)
          reward_scales:
            ball_position: 4.0
            ball_velocity: 2.0
          reward_tracking_sigma:
            ball_position: [0.02, 0.10]
            ball_velocity: [0.02, 0.15]
